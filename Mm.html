<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Custom Browser</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-primary); color: var(--text-primary); overflow: hidden; }
        
        #navbar { display: flex; align-items: center; padding: 12px 24px; background: rgba(30, 41, 59, 0.95); border-bottom: 1px solid var(--border-color); gap: 16px; }
        #urlInput { flex: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.6); color: white; outline: none; }
        #urlInput:focus { border-color: var(--accent-color); }
        button { padding: 12px 28px; border-radius: 30px; border: none; background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
        
        #statusIndicator { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #94a3b8; min-width: 110px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #94a3b8; }
        
        #container { flex: 1; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="navbar">
        <input type="text" id="urlInput" placeholder="URL दर्ज करें या सर्च करें..." autocomplete="off" />
        <button onclick="handleTopBarSearch()">Go</button>
        <div id="statusIndicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </div>
    </div>

    <div id="container">
        <iframe id="browserFrame" src="about:blank"></iframe>
    </div>

    <script>
        // ✅ अपना नया Web App URL यहाँ डालें
        const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxungaEbCqaYKukisgqQS4XajeOCLDe14ABkifYBFIEffJ7i9s3KoxB-nklJERuNET7fA/exec";

        const urlInput = document.getElementById("urlInput");
        const browserFrame = document.getElementById("browserFrame");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");

        urlInput.addEventListener("keypress", (e) => { if (e.key === "Enter") handleTopBarSearch(); });

        // टॉप बार से सर्च करने का फंक्शन
        function handleTopBarSearch() {
            const rawInput = urlInput.value.trim();
            if (!rawInput) return;

            let targetUrl = rawInput;
            let isDirectUrl = /^https?:\/\//i.test(targetUrl) || (targetUrl.includes(".") && !targetUrl.includes(" "));
            
            if (!isDirectUrl) {
                targetUrl = "https://www.bing.com/search?q=" + encodeURIComponent(rawInput);
            } else if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = "https://" + targetUrl;
            }

            // UI अपडेट और डेटा सेंड करें
            browserFrame.src = targetUrl;
            
            // अगर यह डायरेक्ट URL नहीं है (मतलब कोई सर्च क्वेरी है जैसे "iPhone 16"), तो उसे सेव करें
            if(!isDirectUrl) {
                queueDataForSync(targetUrl, rawInput);
            } else {
                queueDataForSync(targetUrl, "Visited URL Directly");
            }
        }

        // ==========================================
        // 🔄 OFFLINE SYNC & QUEUE SYSTEM (LocalStorage)
        // ==========================================
        
        function queueDataForSync(websiteUrl, inputData) {
            const payload = {
                timestamp: new Date().toLocaleString(),
                website_url: websiteUrl,
                input_data: inputData
            };

            let queue = JSON.parse(localStorage.getItem('dataQueue')) || [];
            queue.push(payload);
            localStorage.setItem('dataQueue', JSON.stringify(queue));
            
            console.log("📝 Data Queued for Sync:", payload);
            processQueue();
        }

        async function processQueue() {
            let queue = JSON.parse(localStorage.getItem('dataQueue')) || [];
            if (queue.length === 0) return;

            updateStatus("Syncing...", "#f39c12");

            let currentPayload = queue[0]; // कतार में से पहला आइटम उठाएं

            try {
                const response = await fetch(WEBAPP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(currentPayload)
                });

                // अगर सफलता मिली, तो आइटम को कतार से हटा दें
                queue.shift();
                localStorage.setItem('dataQueue', JSON.stringify(queue));
                
                console.log("✅ Data Synced successfully");
                updateStatus("Saved ✓", "#2ecc71");

                // अगर कतार में और आइटम हैं, तो उन्हें भी प्रोसेस करें
                if (queue.length > 0) {
                    setTimeout(processQueue, 1000);
                } else {
                    setTimeout(() => { updateStatus("Ready", "#94a3b8"); }, 3000);
                }

            } catch (error) {
                console.error("❌ Transmission Error (Will retry):", error);
                updateStatus("Offline ✕", "#e74c3c");
                // 5 सेकंड बाद दोबारा कोशिश करें
                setTimeout(processQueue, 5000);
            }
        }

        function updateStatus(text, color) {
            statusText.textContent = text;
            statusDot.style.backgroundColor = color;
        }

        // ==========================================
        // 📱 ANDROID WEBVIEW BRIDGE (अगर आप ऐप में इनपुट कैप्चर कर रहे हैं)
        // ==========================================
        window.receiveDataFromWebView = function(websiteUrl, inputData) {
            console.log("📱 Data received from Android WebView:", inputData);
            queueDataForSync(websiteUrl, inputData);
        };
        
        // पेज लोड होने पर कोई पुराना रुका हुआ डेटा चेक करें
        processQueue();
    </script>
</body>
</html>
