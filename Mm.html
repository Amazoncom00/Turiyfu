<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Browser UI</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* Glassmorphism Header Bar */
        #navbar {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px var(--shadow-color);
            gap: 16px;
            z-index: 100;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        #urlInput {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-primary);
            outline: none;
            font-size: 14px;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }

        #urlInput:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.9);
        }

        #urlInput::placeholder {
            color: var(--text-secondary);
        }

        button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #ffffff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Dynamic Status Indicator */
        #statusIndicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            min-width: 95px;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            transition: background-color 0.3s ease;
        }

        /* Web View Frame Area */
        #container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="navbar">
        <div class="input-wrapper">
            <input type="text" id="urlInput" placeholder="URL दर्ज करें या खोजें..." autocomplete="off" />
        </div>
        <button onclick="handleNavigation()">Go</button>
        <div id="statusIndicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </div>
    </div>

    <div id="container">
        <iframe id="browserFrame" src="about:blank"></iframe>
    </div>

    <script>
        // बैकएंड वेब ऐप URL
        const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxungaEbCqaYKukisgqQS4XajeOCLDe14ABkifYBFIEffJ7i9s3KoxB-nklJERuNET7fA/exec";

        const urlInput = document.getElementById("urlInput");
        const browserFrame = document.getElementById("browserFrame");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");

        urlInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                handleNavigation();
            }
        });

        function handleNavigation() {
            const rawInput = urlInput.value.trim();
            if (!rawInput) return;

            let targetUrl = rawInput;

            if (!/^https?:\/\//i.test(targetUrl)) {
                if (targetUrl.includes(".") && !targetUrl.includes(" ")) {
                    targetUrl = "https://" + targetUrl;
                } else {
                    targetUrl = "https://www.bing.com/search?q=" + encodeURIComponent(rawInput);
                }
            }

            updateStatus("Saving...", "#f39c12");
            sendDataToSheet(targetUrl, rawInput);

            browserFrame.src = targetUrl;
        }

        async function sendDataToSheet(websiteUrl, inputData) {
            const payload = {
                timestamp: new Date().toLocaleString(),
                website_url: websiteUrl,
                input_data: inputData
            };

            try {
                await fetch(WEBAPP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(payload)
                });

                updateStatus("Saved ✓", "#2ecc71");
                setTimeout(() => { updateStatus("Ready", "#94a3b8"); }, 3000);
            } catch (error) {
                console.error("Transmission Error:", error);
                updateStatus("Error ✕", "#e74c3c");
            }
        }

        function updateStatus(text, color) {
            statusText.textContent = text;
            statusDot.style.backgroundColor = color;
        }
    </script>
</body>
</html>
