<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>auty Mobile</title>
  
  <!-- Telegram Web App SDK (यह बहुत ज़रूरी है) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* Global Reset */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; font-family: "Amazon Ember", Arial, sans-serif;
      background-color: #000;
    }
    
    /* LOGIN UI CSS */
    #login-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000; 
      display: flex; justify-content: center; align-items: center; flex-direction: column; 
    }
    .login-new-user-bg { 
      background: linear-gradient(135deg, #000000, #1a0b2e, #001f3f); color: white; 
      width: 100%; height: 100%; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
      text-align: center;
    }
    .login-warning { 
      color: #ff3333; font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; 
      letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); 
    }
    .login-note { 
      color: #e6f3ff; font-size: 1rem; margin-bottom: 30px; 
      max-width: 300px; line-height: 1.4; 
    }
    .login-anim-text { 
      font-size: 1.5rem; font-weight: bold; background: linear-gradient(90deg, #007bff, #b19cd9, #87ceeb); 
      -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 15px; 
      animation: textFlow 3s infinite linear; 
    }
    @keyframes textFlow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    /* Loader Animation */
    .loader {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-new-user-bg">
      <div id="loading-spinner" class="loader"></div>
      <div class="login-anim-text" id="status-title">Verifying Identity...</div>
      <div class="login-note" id="status-message">Please wait while we check your Telegram ID securely.</div>
    </div>
  </div>

  <script>
    // 1. Initialize Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.expand(); // Make it full screen

    // UI Elements
    const statusTitle = document.getElementById('status-title');
    const statusMessage = document.getElementById('status-message');
    const spinner = document.getElementById('loading-spinner');

    // 2. यहाँ अपना Google Script Web App URL डालें
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTSu8Q0v3AdriS0raxQ6X0WIvqX1lxmKKgzHtYm4kALFEcANnGtVXskUrZZW0_zismPw/exec';

    // 3. Check if opened inside Telegram
    if (tg.initData) {
      
      // Send raw initData to Google Apps Script for secure verification
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8', 
        },
        body: JSON.stringify({
          initData: tg.initData // Backend will parse and verify this securely
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // Success! Redirect to the secret URL
          statusTitle.style.background = "linear-gradient(90deg, #00ff87, #60efff)";
          statusTitle.innerText = "Access Granted!";
          statusMessage.innerText = "Redirecting to secure system...";
          
          setTimeout(() => {
            window.location.href = data.url;
          }, 1000);
        } else {
          // Verification Failed (ID not in sheet or Hash failed)
          spinner.style.display = "none";
          statusTitle.className = "login-warning";
          statusTitle.innerText = "Access Denied";
          statusMessage.innerText = data.message;
          
          // Show close button for telegram
          tg.MainButton.text = "CLOSE APP";
          tg.MainButton.show();
          tg.MainButton.onClick(() => tg.close());
        }
      })
      .catch(err => {
        spinner.style.display = "none";
        statusTitle.className = "login-warning";
        statusTitle.innerText = "Connection Error";
        statusMessage.innerText = "Could not connect to verification server.";
        console.error("Fetch Error:", err);
      });

    } else {
      // Opened outside of Telegram
      spinner.style.display = "none";
      statusTitle.className = "login-warning";
      statusTitle.innerText = "Telegram Required";
      statusMessage.innerText = "This system can only be accessed directly through the official Telegram Bot.";
    }
  </script>
</body>
</html>
