<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>auty Mobile</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* Global Reset */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Amazon Ember", Arial, sans-serif;
      background: #000;
    }
    
    /* Full Screen Content Wrapper */
    #app-container {
      width: 100%; height: 100%; display: none; border: none;
    }
    
    /* LOGIN UI CSS */
    #login-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000; 
      display: none; justify-content: center; align-items: center; flex-direction: column; 
    }
    .login-new-user-bg { 
      background: linear-gradient(135deg, #000000, #1a0b2e, #001f3f); color: white; 
      width: 100%; height: 100%; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
      overflow-y: auto;
    }
    .login-warning { 
      color: #ff3333; font-size: 2rem; font-weight: 900; margin-bottom: 10px; 
      letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); 
    }
    .login-note { 
      text-align: center; color: #e6f3ff; font-size: 0.9rem; margin-bottom: 20px; 
      max-width: 300px; line-height: 1.4; 
    }
    .login-anim-text { 
      font-size: 1.5rem; font-weight: bold; background: linear-gradient(90deg, #007bff, #b19cd9, #87ceeb); 
      -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 15px; 
      animation: textFlow 3s infinite linear; 
    }
    @keyframes textFlow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    .social-icons { display: flex; gap: 20px; margin-bottom: 20px; }
    .social-icon svg { width: 32px; height: 32px; fill: #87ceeb; filter: drop-shadow(0 0 5px #007bff); }

    /* Telegram Widget Container */
    .telegram-widget-container {
      margin-bottom: 15px;
      min-height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Profile Display Card */
    #profile-card {
      display: none;
      margin-top: 15px;
      text-align: center;
      color: white;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #profile-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #4fc3f7;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(79, 195, 247, 0.4);
    }
  </style>
</head>
<body>

  <!-- Actual Web App Container -->
  <iframe id="app-container" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>

  <!-- LOGIN UI OVERLAY -->
  <div id="login-overlay">
    <div id="login-state-new" class="login-new-user-bg">
        <div class="login-warning">WARNING</div>
        <div class="login-note">
            This is used to prank your friends, if you are using this illegally that's your responsibility.
        </div>
        <div class="login-anim-text">@Dark_bot</div>
        
        <div class="social-icons">
            <div class="social-icon">
                <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.293-.605.293l.213-3.053 5.56-5.022c.242-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/></svg>
            </div>
        </div>

        <!-- Telegram Widget Container (For Web Browsers) -->
        <div class="telegram-widget-container" id="tg-widget-root"></div>
        
        <!-- Profile Display Card -->
        <div id="profile-card">
            <img id="profile-photo" src="" alt="Profile Photo">
            <h2 id="profile-name" style="margin: 10px 0 3px 0; font-size: 1.2rem;"></h2>
            <div style="color: #87ceeb; font-size: 0.9rem;">
                <span id="profile-username"></span>
            </div>
            <div style="margin-top: 12px; color: #bbb; font-size: 0.8rem; letter-spacing: 1px;">TELEGRAM USER ID</div>
            <div id="profile-id" style="font-size: 1.4rem; font-weight: bold; color: #ff4444; margin-top: 2px;"></div>
        </div>

        <!-- Status & Error Messages -->
        <p id="login-msg" style="margin-top: 15px; font-weight: bold; color: #87ceeb; text-align: center; max-width: 300px; line-height: 1.4;"></p>
    </div>
  </div>

  <script>
    // ---------------- CONFIGURATION ----------------
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwIag-Un_XnwHClHKFVzSNzyKf_-kTuThZPIK1PBWGQdzPXP_oI5jQS7zo85ZQ6jS0lqA/exec";
    const STORAGE_KEY = "cached_html_content";
    const CACHE_TIME_KEY = "cache_timestamp";
    const CACHE_VALIDITY_MS = 60 * 60 * 1000; // 1 hour cache
    
    const BOT_USERNAME = "Flipcart900_bot"; 
    // -----------------------------------------------

    window.onload = function() {
      // 1. AUTO-DETECT TELEGRAM MINI APP SESSION
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const tgWebApp = window.Telegram.WebApp;
        const rawInitData = tgWebApp.initData;
        const user = tgWebApp.initDataUnsafe.user || {};

        const userPayload = {
          id: user.id,
          first_name: user.first_name,
          last_name: user.last_name,
          username: user.username,
          photo_url: user.photo_url,
          initData: rawInitData,
          is_mini_app: true
        };

        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('tg-widget-root').style.display = 'none';
        onTelegramAuth(userPayload);
        return;
      }

      // 2. EXTERNAL BROWSER CACHE CHECK
      try {
        const storedHtml = localStorage.getItem(STORAGE_KEY);
        const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
        const now = new Date().getTime();

        if (storedHtml && cacheTime && (now - cacheTime < CACHE_VALIDITY_MS)) {
          injectDirectly(storedHtml);
          return;
        }
      } catch (e) {
        console.warn("LocalStorage access restricted.");
      }
      
      // 3. SHOW LOGIN WIDGET IF IN EXTERNAL BROWSER
      document.getElementById('login-overlay').style.display = 'flex';
      loadTelegramWidget();
    };

    function loadTelegramWidget() {
      const container = document.getElementById('tg-widget-root');
      container.innerHTML = ''; 
      const script = document.createElement('script');
      
      script.src = "https://telegram.org/js/telegram-widget.js?22";
      script.setAttribute('data-telegram-login', BOT_USERNAME);
      script.setAttribute('data-size', 'large');
      script.setAttribute('data-radius', '8');
      script.setAttribute('data-onauth', 'onTelegramAuth(user)');
      script.setAttribute('data-request-access', 'write');
      
      container.appendChild(script);
    }

    async function onTelegramAuth(user) {
      const statusMsg = document.getElementById('login-msg');
      const profile = document.getElementById("profile-card");

      // Populate & Display Profile Card
      document.getElementById("profile-photo").src = user.photo_url || "https://telegram.org/img/t_logo.png";
      document.getElementById("profile-name").textContent = user.first_name + (user.last_name ? " " + user.last_name : "");
      document.getElementById("profile-username").textContent = user.username ? "@" + user.username : "No Username";
      document.getElementById("profile-id").textContent = user.id || "-";

      profile.style.display = "block";

      // Update Status Indicator
      statusMsg.style.color = "#87ceeb";
      statusMsg.innerText = "Authenticating secure session...";

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(user) 
        });

        const result = await response.json();

        if (result.success && result.url) {
          statusMsg.style.color = "#00ff66";
          statusMsg.innerText = "✅ Access Granted";
          await fetchAndCacheContent(result.url);
        } else {
          statusMsg.style.color = "#ff4444";
          statusMsg.innerText = "❌ " + (result.message || "Access Denied.");
        }

      } catch (error) {
        statusMsg.style.color = "#ff4444";
        statusMsg.innerText = "❌ Network Error. Please try again.";
      }
    }

    async function fetchAndCacheContent(githubRawUrl) {
      const statusMsg = document.getElementById('login-msg');
      try {
        const githubResponse = await fetch(githubRawUrl);
        if (!githubResponse.ok) throw new Error(`HTTP Error: ${githubResponse.status}`);

        const htmlContent = await githubResponse.text();
        
        try {
          localStorage.setItem(STORAGE_KEY, htmlContent);
          localStorage.setItem(CACHE_TIME_KEY, new Date().getTime().toString());
        } catch (e) {
          console.warn("Could not save to cache, but app will load.");
        }
        
        setTimeout(() => injectDirectly(htmlContent), 600);

      } catch (error) {
        statusMsg.style.color = "#ff4444";
        statusMsg.innerText = "❌ Failed to download authorized app content.";
      }
    }

    function injectDirectly(htmlContent) {
      document.getElementById('login-overlay').style.display = 'none';
      
      const iframe = document.getElementById('app-container');
      iframe.style.display = "block";
      
      const doc = iframe.contentWindow.document || iframe.contentDocument;
      doc.open();
      doc.write(htmlContent);
      doc.close();
    }
  </script>
</body>
</html>
