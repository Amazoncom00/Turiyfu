<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 50px auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .error-card {
      display: none;
      background-color: #ffe6e6;
      border: 1px solid #ff4d4d;
      color: #cc0000;
      padding: 15px;
      border-radius: 8px;
    }
    .loader {
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- External Browser Block Screen -->
  <div id="error-screen" class="container error-card">
    <h2>⚠️ Access Denied</h2>
    <p>Yeh web app sirf official <b>Telegram App</b> ke andar hi open ho sakti hai.</p>
    <p>Kripya is link ko Telegram Bot ke zariye kholein.</p>
  </div>

  <!-- App Main Content -->
  <div id="app-container" class="container">
    <h2>Authenticating...</h2>
    <p class="loader" id="status-text">Telegram session verify ho raha hai, kripya intezar karein...</p>
  </div>

  <script>
    // 🔗 Aapka Google Apps Script Web App URL
    const GAS_WEB_APP_URL = 'YOUR_GOOGLE_APPS_SCRIPT_DEPLOYMENT_URL_HERE';

    document.addEventListener("DOMContentLoaded", function () {
      const tg = window.Telegram ? window.Telegram.WebApp : null;

      // 🚨 CHECK 1: Verifies if opened inside Telegram WebApp environment
      if (!tg || !tg.initData || tg.initData.trim() === "") {
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('error-screen').style.display = 'block';
        return;
      }

      // Telegram UI initialization
      tg.ready();
      tg.expand();

      // Extract user details securely from Telegram SDK
      const user = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

      if (!user || !user.id) {
        document.getElementById('status-text').innerText = "User details fetch nahi ho paaye. Phir se koshish karein.";
        return;
      }

      // Prepare payload to send to Google Apps Script
      const payload = {
        id: user.id,
        first_name: user.first_name || '',
        username: user.username || '',
        initData: tg.initData,
        is_mini_app: true
      };

      // 📤 Send request to Google Apps Script via GET
      const requestUrl = `${GAS_WEB_APP_URL}?data=${encodeURIComponent(JSON.stringify(payload))}`;

      fetch(requestUrl)
        .then(response => response.json())
        .then(data => {
          if (data.success && data.url) {
            // Authorized -> Redirect to secret GitHub page
            window.location.href = data.url;
          } else {
            // Unauthorized or Sheet check failed
            document.getElementById('status-text').innerText = data.message || "Access Denied!";
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('status-text').innerText = "Server connecting error! Dobara try karein.";
        });
    });
  </script>
</body>
</html>
